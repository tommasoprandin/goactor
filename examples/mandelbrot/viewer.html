<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>goactor mandelbrot</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; overflow: auto; }
  img { margin: auto; max-height: 100vh; max-width: 100vw; cursor: zoom-in; }
  img.full { max-height: none; max-width: none; cursor: zoom-out; }
</style>
<img id="view" alt="Mandelbrot render in progress">
<script>
  const view = document.getElementById("view");
  const next = new Image();
  const load = () => { next.src = "out/mandelbrot.snapshot.png?" + Date.now(); };
  next.onload = () => { view.src = next.src; setTimeout(load, 500); };
  next.onerror = () => setTimeout(load, 500);
  view.onclick = () => view.classList.toggle("full");
  load();
</script>
</html>
